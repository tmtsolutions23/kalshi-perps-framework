# ──────────────────────────────────────────────────────────
# Kalshi BTC Perps Trading Framework — Configuration
# All parameters can be overridden via env vars (UPPER_SNAKE)
# ──────────────────────────────────────────────────────────

mode: paper                          # paper | live

market:
  ticker: KXBTCPERP                 # BTC perp ticker

strategy:
  name: pb_ema_trend                # pb_ema_trend | funding_momentum | mean_reversion
  params:
    fast_ema_period: 12
    atr_period: 14
    atr_multiplier_sl: 1.5           # stop loss = ATR × this
    atr_multiplier_tp: 3.0           # take profit = ATR × this (wider: 3:1.5 for growth)
    pullback_threshold: 0.3          # pullback entry: within pullback×ATR of fast EMA
    breakout_threshold: 0.4          # breakout entry: price accelerating past EMA by ≥0.4 ATR
    breakout_min_runup_atr: 0.5      # minimum prior EMA distance for breakout detection
    max_position_hours: 168

risk:
  initial_equity: 500               # paper trading starting balance
  max_leverage: 6.0                 # Kalshi BTC cap is ~6.4x — raise as account grows
  min_leverage: 2.0
  account_fraction_per_trade: 0.25
  risk_per_trade_pct: 0.03          # base risk per trade (before Kelly overrides)
  kelly_fraction: 0.25              # quarter Kelly — grows sizing with proven win rate
  min_risk_pct: 0.02                # floor: never risk less than 2%
  max_risk_pct: 0.08                # ceiling: never risk more than 8%
  max_daily_drawdown_pct: 10.0
  max_total_drawdown_pct: 25.0
  circuit_breaker_drawdown_pct: 15.0

execution:
  slippage_bps: 5

schedule:
  check_interval_minutes: 60

performance:
  adapt_params: true
  adaptation_min_trades: 30          # min trades before adaptation kicks in
  adaptation_lookback: 50            # evaluate last N trades
  max_trade_history: 200

alerts:
  on_signal: true
  on_entry: true
  on_exit: true
  on_error: true
  on_drawdown_warning: true
  heartbeat: false

paths:
  state_file: data/state.json
  log_file: data/perps.log

kalshi:
  api_base: https://external-api.kalshi.com/trade-api/v2/margin
  key_config: /root/.hermes/secrets/kalshi_api_config.json
  key_path: /root/.hermes/secrets/kalshi_private_key.pem